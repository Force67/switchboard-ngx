[package]
name = "switchboard-backend-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Database
switchboard-database = { path = "../database" }
switchboard-users = { path = "../users" }
switchboard-auth = { path = "../auth" }
switchboard-config = { path = "../config" }
switchboard-orchestrator = { path = "../orchestrator" }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
urlencoding = "2.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
cuid2 = { workspace = true }

# WebSocket
tokio = { workspace = true, features = ["full"] }
futures-util = { workspace = true }

# Database
sqlx = { workspace = true }

# Providers / completion
denkwerk = { workspace = true }

# Binary data / encoding
base64 = { workspace = true }
bytes = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# HTTP client for web search and external services
reqwest = { workspace = true }

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
